.rings i{width:24px;height:9px;border-radius:5px;background:linear-gradient(#ddd,#8a8a8a);box-shadow:0 1px 2px var(--shadow)}
.nb.ready:hover{transform:translateY(-4px) rotate(-.6deg)}

/* Адреса Apps Script (та сама, що в боті, закінчується на /exec).
   Бот віддає: що відкрито кому (mode=access) і позначки ДЗ. */
const API_URL="https://script.google.com/macros/s/AKfycbwi1AzxlGzRW8HrejKj9aJuB19bgpdrBaKGp0i85SwyYShcp2rf0n5gUnomIBB77LPi/exec";

/* Усі учні: "Ім'я": блок (0 = «Українська», 1–4 = клас).
   Нового учня дописуйте сюди, а також у список STUDENTS у боті. */
const STUDENTS={"Гліб":0,"Матвій":0,"Елія":0,"Святослав":0,"Марічка":2,"Матвій 3":3};

/* Теми, відкриті вручну в коді: "Ім'я": ["ukr-lesson-01.html", ...]
   (решту відкриває бот кнопкою «🔓 Теми») */
const STUDENT_ACCESS={"Марічка":["urok-5-imennyk-hto-shcho.html"]};

const tabs=document.getElementById('tabs'),content=document.getElementById('content');
const qs=new URLSearchParams(location.search);
let who=qs.get('u'),teacher=false;
try{
  if(qs.has('vchytel')&&!who){localStorage.setItem('zoshyt_teacher','1');localStorage.removeItem('zoshyt_current_student');teacher=true;}
  else if(qs.has('all')){localStorage.removeItem('zoshyt_current_student');teacher=localStorage.getItem('zoshyt_teacher')==='1';}
  else if(who){localStorage.setItem('zoshyt_current_student',who);localStorage.removeItem('zoshyt_teacher');}
  else{teacher=localStorage.getItem('zoshyt_teacher')==='1';if(!teacher)who=localStorage.getItem('zoshyt_current_student');}
}catch(e){}
if(qs.has('all')||teacher)who=null;
if(teacher)document.body.classList.add('teacher');

const norm=s=>(s||'').trim().replace(/\s+/g,' ').toLowerCase();
function blockOf(name){
  const n=norm(name);
  for(const k in STUDENTS){if(norm(k)===n)return STUDENTS[k];}
  return null;
}
const lock=who?blockOf(who):null;
const VISIBLE=teacher?CLASSES:(lock===null?[]:CLASSES.filter(c=>c.n===lock));

/* ---- доступи ---- */
let access=[];                       // відкриті уроки цього учня
const staticFor=name=>{for(const k in STUDENT_ACCESS){if(norm(k)===norm(name))return STUDENT_ACCESS[k];}return [];};
let allMap={};                       // для вчителя: {код: [файли]}
let hw={};                           // ДЗ учня: {файл_тесту: {number}}
let curN=null;

function allStudents(){
  const s=Object.keys(STUDENTS);
  Object.keys(STUDENT_ACCESS).forEach(k=>{if(!s.some(x=>norm(x)===norm(k)))s.push(k);});
  return s;
}
function openFor(file){
  return allStudents().filter(name=>{
    const dyn=allMap[norm(name)]||[];
    return staticFor(name).indexOf(file)!==-1||dyn.indexOf(file)!==-1;
  });
}
function link(h){
  if(!h)return h;
  let r=h;
  if(!teacher&&who)r+=(r.indexOf('?')>-1?'&':'?')+'student='+encodeURIComponent(who);
  return r;
}
function testPill(file,cls,label){
  if(!file)return '';
  const h=hw[file];
  const href=link(h?file+(file.indexOf('?')>-1?'&':'?')+'hw='+encodeURIComponent(h.number):file);
  return `<a class="tp ${cls||''} ${h?'homework':''}" href="${href}">${h?label+' '+h.number:label}</a>`;
}

function colorOf(c){return getComputedStyle(document.documentElement).getPropertyValue(c.color).trim();}
function drawTabs(n){
  tabs.style.display=(VISIBLE.length>1)?'':'none';
  tabs.innerHTML=VISIBLE.map(k=>`<button class="tab ${k.label?'txt ':''}${k.n===n?'on':''}" style="--cc:${colorOf(k)}" data-n="${k.n}">${k.label?k.label:`${k.n}<small>клас</small>`}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(+b.dataset.n));
}
function show(n){
  curN=n;
  const c=CLASSES.find(x=>x.n===n),color=colorOf(c);
  drawTabs(n);
  let html='';
  c.sections.forEach(s=>{
    const items=teacher?s.items:s.items.filter(i=>i[4]==='ready'&&access.indexOf(i[3])!==-1);
    if(!items.length)return;
    html+=`<div style="--cc:${color}"><div class="sh"><div class="sec">${s.t}</div>${testPill(s.gt,'gen','📝 Загальний тест')}</div><div class="grid">`+
    items.map(i=>{
      const rd=i[4]==='ready';
      let badge='';
      if(teacher){
        const o=openFor(i[3]);
        badge=o.length?`<span class="ob open" title="${o.join(', ')}">🔓 Відкрито · ${o.length}</span>`:`<span class="ob closed">🔒 нікому не відкрито</span>`;
      }
      return `<div class="cw"><div class="nb ${i[4]}" style="--cc:${color}">
        <div class="rings"><i></i><i></i><i></i><i></i></div>
        <span class="lab">${i[0]}</span><br>
        <h2>${rd?`<a href="${link(i[3])}">${i[1]}</a>`:i[1]}</h2><br><p>${i[2]}</p>
        ${badge}<span class="st">${rd?'Відкрити':'Скоро'}</span></div>
        ${testPill(i[5],'','📝 ДЗ')}</div>`;}).join('')+`</div></div>`;
  });
  content.innerHTML=html||(teacher?'':'<p class="brand" style="color:var(--soft);font-weight:600">Поки для тебе не відкрито жодної теми. Зверніться до вчительки.</p>');
}

/* ---- відповіді бота (JSONP) ---- */
window.applyAccess=function(list){
  const extra=(list||[]).filter(h=>access.indexOf(h)===-1);
  access=access.concat(extra);
  if(curN!==null)show(curN);
};
window.applyAllAccess=function(map){allMap=map||{};if(curN!==null&&curN>=0)show(curN);};
window.applyHomework=function(map){hw=map||{};if(curN!==null)show(curN);};
function jsonp(q){const s=document.createElement('script');s.src=API_URL+(API_URL.indexOf('?')>-1?'&':'?')+q;document.body.appendChild(s);}

/* ---- старт ---- */
const bp=document.querySelector('.brand p');
if(teacher){
  document.querySelector('.eyebrow').textContent='Навігація · для вчителя';
  bp.textContent='Кожному учню — своє посилання (…/index.html?u=Ім\'я). Він бачить лише ті теми, які ви йому відкрили — і урок, і ДЗ до нього. Оберіть клас, щоб побачити теми та хто що має відкритим.';
  document.getElementById('tnote').innerHTML='<a href="ukr-teacher.html?vchytel=1">📊 Кабінет вчителя: результати й посилання учнів</a>';
  drawTabs(-1);
  jsonp('mode=access_all&callback=applyAllAccess');
}else if(lock!==null){
  bp.style.display='none';   /* учням підпис під заголовком не показуємо */
  access=staticFor(who).slice();
  show(lock);
  jsonp('mode=access&callback=applyAccess&student='+encodeURIComponent(who));
  jsonp('callback=applyHomework&student='+encodeURIComponent(who));
}else{
  bp.textContent='Це посилання недійсне. Зверніться до вчительки за новим.';
  tabs.style.display='none';
}
</script>
