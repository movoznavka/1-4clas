<title>Зошити з мови · 1–4 клас</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FCF0DC;--card:#FFFBF2;--ink:#3A2016;--soft:#8A6552;--line:#BFD7EA;--margin:#E8837A;--shadow:rgba(58,32,22,.4);--red:#E5484D;--ok:#2E8B57;
--c0:#8A5BB5;--c1:#E0592F;--c2:#D98A1F;--c3:#3F8F5B;--c4:#5B6FD6;}
:root:not([data-theme="light"]){color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241812;--card:#33241c;--ink:#fbeedd;--soft:#c9a98f;--line:#4a5d70;--margin:#a8544d;--shadow:rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#241812;--card:#33241c;--ink:#fbeedd;--soft:#c9a98f;--line:#4a5d70;--margin:#a8544d;--shadow:rgba(0,0,0,.6)}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Quicksand',sans-serif;padding:26px 16px 60px;min-height:100vh}
.wrap{max-width:900px;margin:0 auto}
.brand{text-align:center;margin-bottom:22px}
.eyebrow{font-weight:700;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--c1)}
h1{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(26px,7vw,38px);margin:4px 0 6px}
.brand p{margin:0;color:var(--soft);font-weight:600}
.banner{display:none;background:var(--red);color:#fff;font:800 12.5px 'Baloo 2',sans-serif;letter-spacing:.05em;text-transform:uppercase;text-align:center;padding:9px 14px;border-radius:12px;margin-bottom:20px}
body.teacher .banner{display:block}
.tabs{display:flex;gap:10px;justify-content:center;margin-bottom:26px;flex-wrap:wrap}
.tab{border:none;cursor:pointer;background:var(--card);color:var(--ink);border-radius:20px;padding:12px 22px;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:20px;box-shadow:0 10px 20px -14px var(--shadow);transition:transform .15s}
.tab small{display:block;font:700 11px 'Quicksand',sans-serif;letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
.tab.txt{font-weight:600;font-size:16px;letter-spacing:.03em;display:flex;align-items:center;padding:12px 24px}
.tab:hover{transform:translateY(-2px)}
.tab.on{background:var(--cc);color:#fff}.tab.on small{color:#fff}
.sh{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:26px 0 14px 4px}
.sec{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;letter-spacing:.04em;text-transform:uppercase;color:var(--cc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 18px}
.cw{display:flex;flex-direction:column;gap:8px}
.nb{position:relative;display:block;color:var(--ink);background:var(--card);border-radius:6px 18px 18px 6px;padding:18px 18px 16px 52px;min-height:176px;box-shadow:0 16px 28px -18px var(--shadow);border-left:10px solid var(--cc);transition:transform .18s cubic-bezier(.34,1.56,.64,1);
background-image:repeating-linear-gradient(transparent 0 25px,var(--line) 25px 26px);background-position:0 44px;background-repeat:repeat-y;background-size:100% 100%}
.nb::before{content:'';position:absolute;left:38px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.6}
.rings{position:absolute;left:-17px;top:14px;bottom:14px;display:flex;flex-direction:column;justify-content:space-around}
.rings i{width:24px;height:9px;border-radius:5px;background:linear-gradient(#ddd,#8a8a8a);box-shadow:0 1px 2px var(--shadow)}
.nb.ready:hover{transform:translateY(-4px) rotate(-.6deg)}
.nb.soon{opacity:.55}
.lab{display:inline-block;background:var(--cc);color:#fff;border-radius:8px;padding:2px 10px;font:800 11px 'Baloo 2',sans-serif;letter-spacing:.06em;text-transform:uppercase;margin-bottom:8px}
.nb h2{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:18px;line-height:1.25;margin:0 0 6px 0;background:var(--card);display:inline;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.nb p{margin:10px 0 0;font-weight:600;font-size:13px;color:var(--soft);background:var(--card);display:inline-block;padding:0 2px}
.st{pointer-events:none;position:absolute;right:12px;bottom:10px;font:800 10.5px 'Baloo 2',sans-serif;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--cc);color:#fff}
.nb.soon .st{background:var(--soft)}
.nb h2 a{color:inherit;text-decoration:none}
.nb h2 a::after{content:'';position:absolute;inset:0;border-radius:6px 18px 18px 6px}
.nb:focus-within{outline:2px solid var(--cc);outline-offset:2px}
.ob{position:absolute;left:52px;bottom:10px;z-index:2;font:800 10.5px 'Baloo 2',sans-serif;text-transform:uppercase;padding:3px 10px;border-radius:999px;background:var(--card)}
.ob.open{color:var(--ok);border:2px solid var(--ok)}
.ob.closed{color:var(--red);border:2px solid var(--red)}
/* плашки тестів */
.tp{display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;font:800 12.5px 'Baloo 2',sans-serif;padding:8px 14px;border-radius:14px;color:var(--ok);background:rgba(46,139,87,.14);transition:transform .15s}
.tp:hover{transform:translateY(-2px)}
.tp.soon{opacity:.55;pointer-events:none;color:var(--soft);background:var(--card)}
.tp.gen{display:inline-flex;padding:7px 16px}
.tp.homework{color:#7A3B00;background:linear-gradient(135deg,#FFE27A,#FF9A3D);animation:hw 1.6s ease-in-out infinite}
@keyframes hw{0%,100%{box-shadow:0 0 6px 0 rgba(255,140,40,.55)}50%{box-shadow:0 0 18px 6px rgba(255,140,40,.85)}}
@media (prefers-reduced-motion:reduce){.tp.homework{animation:none}}
.note{text-align:center;color:var(--soft);font-size:12.5px;font-weight:600;margin-top:36px}
.note a{color:var(--c1)}
</style>

/* Адреса Apps Script (та сама, що в боті, закінчується на /exec).
   Бот віддає: що відкрито кому (mode=access) і позначки ДЗ. */
const API_URL="https://script.google.com/macros/s/AKfycbwi1AzxlGzRW8HrejKj9aJuB19bgpdrBaKGp0i85SwyYShcp2rf0n5gUnomIBB77LPi/exec";

/* Усі учні: "Ім'я": блок (0 = «Українська», 1–4 = клас).
   Нового учня дописуйте сюди, а також у список STUDENTS у боті. */
const STUDENTS={"Гліб":0,"Матвій":0,"Елія":0,"Святослав":0,"Марічка":2,"Матвій 3":3};

/* Теми, відкриті вручну в коді: "Ім'я": ["ukr-lesson-01.html", ...]
   (решту відкриває бот кнопкою «🔓 Теми») */
const STUDENT_ACCESS={"Марічка":["urok-5-imennyk-hto-shcho.html"]};

const tabs=document.getElementById('tabs'),content=document.getElementById('content');
const qs=new URLSearchParams(location.search);
let who=qs.get('u'),teacher=false;
try{
  if(qs.has('vchytel')&&!who){localStorage.setItem('zoshyt_teacher','1');localStorage.removeItem('zoshyt_current_student');teacher=true;}
  else if(qs.has('all')){localStorage.removeItem('zoshyt_current_student');teacher=localStorage.getItem('zoshyt_teacher')==='1';}
  else if(who){localStorage.setItem('zoshyt_current_student',who);localStorage.removeItem('zoshyt_teacher');}
  else{teacher=localStorage.getItem('zoshyt_teacher')==='1';if(!teacher)who=localStorage.getItem('zoshyt_current_student');}
}catch(e){}
if(qs.has('all')||teacher)who=null;
if(teacher)document.body.classList.add('teacher');

const norm=s=>(s||'').trim().replace(/\s+/g,' ').toLowerCase();
function blockOf(name){
  const n=norm(name);
  for(const k in STUDENTS){if(norm(k)===n)return STUDENTS[k];}
  return null;
}
const lock=who?blockOf(who):null;
const VISIBLE=teacher?CLASSES:(lock===null?[]:CLASSES.filter(c=>c.n===lock));

/* ---- доступи ---- */
let access=[];                       // відкриті уроки цього учня
const staticFor=name=>{for(const k in STUDENT_ACCESS){if(norm(k)===norm(name))return STUDENT_ACCESS[k];}return [];};
let allMap={};                       // для вчителя: {код: [файли]}
let hw={};                           // ДЗ учня: {файл_тесту: {number}}
let curN=null;

function allStudents(){
  const s=Object.keys(STUDENTS);
  Object.keys(STUDENT_ACCESS).forEach(k=>{if(!s.some(x=>norm(x)===norm(k)))s.push(k);});
  return s;
}
function openFor(file){
  return allStudents().filter(name=>{
    const dyn=allMap[norm(name)]||[];
    return staticFor(name).indexOf(file)!==-1||dyn.indexOf(file)!==-1;
  });
}
function link(h){
  if(!h)return h;
  let r=h;
  if(!teacher&&who)r+=(r.indexOf('?')>-1?'&':'?')+'student='+encodeURIComponent(who);
  return r;
}
function testPill(file,cls,label){
  if(!file)return '';
  const h=hw[file];
  const href=link(h?file+(file.indexOf('?')>-1?'&':'?')+'hw='+encodeURIComponent(h.number):file);
  return `<a class="tp ${cls||''} ${h?'homework':''}" href="${href}">${h?label+' '+h.number:label}</a>`;
}

function colorOf(c){return getComputedStyle(document.documentElement).getPropertyValue(c.color).trim();}
function drawTabs(n){
  tabs.style.display=(VISIBLE.length>1)?'':'none';
  tabs.innerHTML=VISIBLE.map(k=>`<button class="tab ${k.label?'txt ':''}${k.n===n?'on':''}" style="--cc:${colorOf(k)}" data-n="${k.n}">${k.label?k.label:`${k.n}<small>клас</small>`}</button>`).join('');
  tabs.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(+b.dataset.n));
}
function show(n){
  curN=n;
  const c=CLASSES.find(x=>x.n===n),color=colorOf(c);
  drawTabs(n);
  let html='';
  c.sections.forEach(s=>{
    const items=teacher?s.items:s.items.filter(i=>i[4]==='ready'&&access.indexOf(i[3])!==-1);
    if(!items.length)return;
    html+=`<div style="--cc:${color}"><div class="sh"><div class="sec">${s.t}</div>${testPill(s.gt,'gen','📝 Загальний тест')}</div><div class="grid">`+
    items.map(i=>{
      const rd=i[4]==='ready';
      let badge='';
      if(teacher){
        const o=openFor(i[3]);
        badge=o.length?`<span class="ob open" title="${o.join(', ')}">🔓 Відкрито · ${o.length}</span>`:`<span class="ob closed">🔒 нікому не відкрито</span>`;
      }
      return `<div class="cw"><div class="nb ${i[4]}" style="--cc:${color}">
        <div class="rings"><i></i><i></i><i></i><i></i></div>
        <span class="lab">${i[0]}</span><br>
        <h2>${rd?`<a href="${link(i[3])}">${i[1]}</a>`:i[1]}</h2><br><p>${i[2]}</p>
        ${badge}<span class="st">${rd?'Відкрити':'Скоро'}</span></div>
        ${testPill(i[5],'','📝 ДЗ')}</div>`;}).join('')+`</div></div>`;
  });
  content.innerHTML=html||(teacher?'':'<p class="brand" style="color:var(--soft);font-weight:600">Поки для тебе не відкрито жодної теми. Зверніться до вчительки.</p>');
}

/* ---- відповіді бота (JSONP) ---- */
window.applyAccess=function(list){
  const extra=(list||[]).filter(h=>access.indexOf(h)===-1);
  access=access.concat(extra);
  if(curN!==null)show(curN);
};
window.applyAllAccess=function(map){allMap=map||{};if(curN!==null&&curN>=0)show(curN);};
window.applyHomework=function(map){hw=map||{};if(curN!==null)show(curN);};
function jsonp(q){const s=document.createElement('script');s.src=API_URL+(API_URL.indexOf('?')>-1?'&':'?')+q;document.body.appendChild(s);}

/* ---- старт ---- */
const bp=document.querySelector('.brand p');
if(teacher){
  document.querySelector('.eyebrow').textContent='Навігація · для вчителя';
  bp.textContent='Кожному учню — своє посилання (…/index.html?u=Ім\'я). Він бачить лише ті теми, які ви йому відкрили — і урок, і ДЗ до нього. Оберіть клас, щоб побачити теми та хто що має відкритим.';
  document.getElementById('tnote').innerHTML='<a href="ukr-teacher.html?vchytel=1">📊 Кабінет вчителя: результати й посилання учнів</a>';
  drawTabs(-1);
  jsonp('mode=access_all&callback=applyAllAccess');
}else if(lock!==null){
  bp.textContent='Привіт, '+who.replace(/\s*\d+$/,'')+'! Обери урок — за кожне правильне завдання ⭐';
  access=staticFor(who).slice();
  show(lock);
  jsonp('mode=access&callback=applyAccess&student='+encodeURIComponent(who));
  jsonp('callback=applyHomework&student='+encodeURIComponent(who));
}else{
  bp.textContent='Це посилання недійсне. Зверніться до вчительки за новим.';
  tabs.style.display='none';
}
</script>
